name: chorus-identity

x-tidecloak-image: &tidecloak-image tideorg/tidecloak-dev@sha256:3f52d0bc3e4e3ae5153e172960003bbe94705cd40af6561fd4c7c4434aaa2708

services:
  tidecloak-data-init:
    # A new mount at this image's absent h2 path is created as root:root.
    # Prepare only the database volume; the server still runs as UID 1000.
    image: *tidecloak-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:0 /data && chmod u+rwx /data"]
    network_mode: none
    read_only: true
    volumes:
      - tidecloak-data:/data

  tidecloak:
    # TideCloak dev 0.14.41, multi-platform digest resolved on 2026-10-22.
    # Local startup verified; live Tide enrollment still needs verification.
    image: *tidecloak-image
    depends_on:
      tidecloak-data-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${TIDECLOAK_BOOTSTRAP_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TIDECLOAK_BOOTSTRAP_PASSWORD:?Set a private bootstrap password in .env.tidecloak.local}
    volumes:
      - tidecloak-data:/opt/keycloak/data/h2
    stop_grace_period: 30s

volumes:
  tidecloak-data:
